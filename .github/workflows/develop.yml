name: Publish Pre-release NuGet Package (Develop)

on:
  push:
    branches:
    - develop
    - feature/*
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore dependencies
        run: dotnet restore src/lowlandtech.testing.features.sln

      - name: Build project
        run: dotnet build src/lowlandtech.testing.features.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/lowlandtech.testing.features.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

      - name: Pack NuGet package with pre-release suffix
        run: dotnet pack src/lowlandtech.testing.features.sln --configuration Release --no-build --output ./nupkg /p:VersionSuffix=alpha

      - name: Publish NuGet package
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
