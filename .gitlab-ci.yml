image: mcr.microsoft.com/dotnet/sdk:9.0

variables:
  # Disable .NET Core telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # Disable .NET Core welcome message
  DOTNET_NOLOGO: "true"
  # Solution path
  SOLUTION_PATH: "src/lowlandtech.testing.features.sln"
  # Main project path
  MAIN_PROJECT_PATH: "src/lowlandtech.testing.features/LowlandTech.Testing.Features.csproj"
  # Reporter project path
  REPORTER_PROJECT_PATH: "src/lowlandtech.testing.features.reporter/LowlandTech.Testing.Features.Reporter.csproj"
  # NuGet output directory
  NUGET_OUTPUT_DIR: "nupkg"
  # Coverage output directory
  COVERAGE_DIR: "coverage"

stages:
  - build
  - test
  - pack
  - publish

# Cache NuGet packages and build outputs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .nuget/
    - "**/obj/"

before_script:
  - dotnet --version
  - dotnet tool install --global GitVersion.Tool --version 6.* || true
  - export PATH="$PATH:$HOME/.dotnet/tools"

# Build Debug stage (for all branches)
build:debug:
  stage: build
  script:
    - dotnet restore $SOLUTION_PATH
    - dotnet build $SOLUTION_PATH --configuration Debug --no-restore
  artifacts:
    paths:
      - src/*/bin/Debug/
      - src/*/obj/
    expire_in: 1 hour

# Build Release stage (only for main, develop, and tags)
build:release:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
  script:
    - dotnet restore $SOLUTION_PATH
    - dotnet build $SOLUTION_PATH --configuration Release --no-restore
  artifacts:
    paths:
      - src/*/bin/Release/
      - src/*/obj/
    expire_in: 1 hour

# Test stage with code coverage
test:
  stage: test
  dependencies:
    - build:debug
  script:
    - mkdir -p $COVERAGE_DIR
    - dotnet test $SOLUTION_PATH --configuration Debug --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory $COVERAGE_DIR
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  artifacts:
    when: always
    paths:
      - "**/*.trx"
      - "$COVERAGE_DIR/**/*.xml"
      - "$COVERAGE_DIR/**/*.json"
    reports:
      junit: "**/*.trx"
      coverage_report:
        coverage_format: cobertura
        path: $COVERAGE_DIR/**/coverage.cobertura.xml
    expire_in: 30 days

# Pack NuGet packages with GitVersion
pack:
  stage: pack
  dependencies:
    - build:release
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
  script:
    - mkdir -p $NUGET_OUTPUT_DIR
    - dotnet-gitversion /output json /showvariable SemVer > version.txt || echo "2025.7.1" > version.txt
    - export VERSION=$(cat version.txt)
    - echo "Packing version $VERSION"
    - dotnet pack $MAIN_PROJECT_PATH --configuration Release --no-build --output $NUGET_OUTPUT_DIR /p:PackageVersion=$VERSION
    - dotnet pack $REPORTER_PROJECT_PATH --configuration Release --no-build --output $NUGET_OUTPUT_DIR /p:PackageVersion=$VERSION
    - ls -la $NUGET_OUTPUT_DIR
  artifacts:
    paths:
      - $NUGET_OUTPUT_DIR/*.nupkg
      - $NUGET_OUTPUT_DIR/*.snupkg
      - version.txt
    expire_in: 30 days

# Publish to GitLab Package Registry
publish:
  stage: publish
  dependencies:
    - pack
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG
  script:
    - |
      for package in $NUGET_OUTPUT_DIR/*.nupkg; do
        echo "Publishing $package to GitLab Package Registry..."
        dotnet nuget push "$package" \
          --source "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/nuget/index.json" \
          --api-key ${CI_JOB_TOKEN} \
          --skip-duplicate
      done
  needs:
    - pack
